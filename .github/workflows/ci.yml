name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Next.js
        run: npm run build

      - name: Upload static export (for release workflow)
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: out/
          retention-days: 1
