name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  web:
    name: Build web frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: out/
          retention-days: 1

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os: ubuntu-22.04
          - platform: macos-latest
            os: macos-latest
          - platform: windows-latest
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: web-out
          path: out/

      - name: Build Tauri desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Generate with: npm run tauri:signer
          # Add the private key as a GitHub secret named TAURI_SIGNING_PRIVATE_KEY.
          # Then also paste the public key into tauri.conf.json → plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Timely ${{ github.ref_name }}
          releaseBody: |
            Free and open source (MIT). AI-powered academic OS for students.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
